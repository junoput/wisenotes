[project]
name = "wisenotes"
version = "0.1.0"
description = "FastAPI + Jinja + HTMX note app"
authors = [{ name = "Your Name" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "filelock>=3.15.4",
  "itsdangerous>=2.1.2",
  "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.8",
  "mypy>=1.11.1",
  "pytest>=8.3.2",
  "httpx>=0.27.0",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "anyio>=4.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
# E501: line length is advisory. B008: `Depends()` in defaults is the FastAPI idiom.
# PLR2004: HTTP status codes and small limits read better inline than as constants.
# PLR09xx: complexity thresholds; the two handlers over them are the chapter-tree
# save paths, better fixed by the no-JS rework than by splitting for the linter.
# PLW2901: `img = img.convert(...)` inside `with Image.open() as img` is the Pillow idiom.
ignore = ["E501", "B008", "PLR2004", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLW2901"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
